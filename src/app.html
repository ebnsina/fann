<!doctype html>
<html lang="en" class="%fann.theme% h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Only for the `system` preference. An explicit light or dark choice is in a
			// cookie, and `hooks.server.ts` has already stamped the class above — the
			// server-rendered HTML is correct before this runs and this does nothing.
			//
			// Nothing in an HTTP request reports the operating system's colour setting,
			// so `system` can only be resolved here, before first paint.
			try {
				const root = document.documentElement;
				if (!root.classList.contains('dark') && !root.classList.contains('light')) {
					root.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
				}
			} catch {
				/* No matchMedia — fall back to the light theme. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
